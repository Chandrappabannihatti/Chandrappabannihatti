<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAMPS — Centralized Academic Monitoring & Prediction System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background: #f1f5f9">
    <div id="root">
      <!-- Boot splash: visible until React mounts; replaced by the app -->
      <div id="boot-splash" style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;gap:14px">
        <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#0ea5e9);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 10px 25px rgba(99,102,241,.35)">CA</div>
        <div style="color:#475569;font-size:14px;font-weight:600">Loading CAMPS…</div>
        <div style="width:22px;height:22px;border:3px solid #c7d2fe;border-top-color:#6366f1;border-radius:50%;animation:camps-spin .8s linear infinite"></div>
        <style>@keyframes camps-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      // Surface fatal errors on-page (preview iframes hide the console).
      window.__campsShowError = function (msg) {
        if (document.getElementById("camps-fatal")) return;
        var el = document.createElement("div");
        el.id = "camps-fatal";
        el.style.cssText =
          "position:fixed;inset:auto 16px 16px 16px;max-width:720px;margin:0 auto;background:#3f1d1d;color:#fecaca;font:13px/1.5 ui-monospace,monospace;padding:14px 16px;border-radius:12px;z-index:99999;box-shadow:0 10px 40px rgba(0,0,0,.4);white-space:pre-wrap";
        el.textContent = "CAMPS failed to start:\n" + msg;
        document.body.appendChild(el);
      };
      window.addEventListener("error", function (e) {
        (window.__campsErrors = window.__campsErrors || []).push(String(e.message || e.error));
        if (!document.getElementById("root").hasChildNodes() || document.getElementById("boot-splash")) {
          window.__campsShowError(String(e.message || e.error));
        }
      });
      window.addEventListener("unhandledrejection", function (e) {
        if (document.getElementById("boot-splash")) {
          window.__campsShowError("Unhandled promise rejection: " + String(e.reason));
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
